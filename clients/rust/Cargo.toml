# llmleaf-client — official Rust SDK for the llmleaf LLM proxy.
#
# IMPORTANT: this crate is its OWN workspace root, deliberately detached from the
# repository's root Cargo workspace (which globs `crates/*`). The empty `[workspace]`
# table below stops Cargo from walking up the tree and trying to enrol this crate as a
# member of the core workspace. Keep it.
[package]
name = "llmleaf-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Official Rust client SDK for the llmleaf LLM proxy (OpenAI/OpenRouter-shaped JSON over HTTP)."
authors = ["Fionn Langhans <fionnlanghans@codefionn.eu>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/codefionn/llmleaf"
readme = "README.md"
keywords = ["llmleaf", "llm", "openai", "client", "proxy"]
categories = ["api-bindings", "web-programming::http-client"]

# Standalone workspace: do not adopt the repo-root workspace under clients/.
[workspace]

[features]
default = ["tokio"]
tokio = ["dep:reqwest", "dep:tokio"]
compio = ["dep:compio", "dep:cyper"]

[dependencies]
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "multipart",
] }
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread", "macros"] }
compio = { version = "0.16", optional = true, default-features = false, features = ["runtime", "time", "bytes", "macros"] }
cyper = { version = "0.5", optional = true, default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
thiserror = "2"
bytes = "1"
base64 = "0.22"
prost = "0.14"
url = "2"
http = "1"

[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["tokio"]

[[example]]
name = "compio"
path = "examples/compio.rs"
required-features = ["compio"]

[[test]]
name = "responses"
path = "tests/responses.rs"
required-features = ["tokio"]
